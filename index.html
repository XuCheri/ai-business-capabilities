<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI 业务原子能力</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:#17283d;font:16px/1.7 "PingFang SC","Microsoft YaHei",sans-serif}main{max-width:1180px;margin:auto;padding:60px 24px}h1{font-size:40px;line-height:1.3}header{max-width:770px;margin-bottom:38px}header p{color:#52667c}section{display:grid;grid-template-columns:1fr 1fr;gap:28px}article{background:white;border:1px solid #dbe3ec;border-radius:14px;overflow:hidden}img{width:100%;display:block}article div{padding:25px}h2{font-size:22px;margin:0 0 10px}a{color:#1c4b7b}a.go{display:inline-block;background:#1c4b7b;color:white;border-radius:8px;padding:11px 22px;text-decoration:none}a:focus-visible{outline:3px solid #bd7731;outline-offset:4px}.hint{margin-top:35px;color:#52667c}footer{margin-top:35px;border-top:1px solid #dbe3ec;padding-top:20px}@media(max-width:760px){main{padding:28px 18px}h1{font-size:30px}section{grid-template-columns:1fr}}</style><main><header><h1>让 AI 的回答与动作<br>都有可复核的业务依据</h1><p>两个独立的 TypeScript 能力：一个追溯回答引用，一个约束工具操作。打开工作台，体验规则如何影响业务结果。</p></header><section><article><img src="assets/evidence-trace-cover.svg" alt="知识库回答引用校验与证据追溯"><div><h2>引用证据工作台</h2><p>核对版本、引文、有效期与来源访问范围。逐条检查论断，查看对应证据位置和发布决策。</p><a class="go" href="evidence-trace/demo/">打开引用工作台</a></div></article><article><img src="assets/action-gate-cover.svg" alt="AI工具调用风险预检与审批门控"><div><h2>工具动作审批台</h2><p>预检工具调用、审阅具体参数并批准。体验参数变更、过期许可与重复消费如何被拒绝。</p><a class="go" href="action-gate/demo/">打开动作审批台</a></div></article></section><p class="hint">演示使用虚构数据，不连接大模型、不执行真实工具。引用一致性不等于事实正确；生产审批与鉴权应运行在可信后端。</p><footer><a href="https://github.com/XuCheri/ai-business-capabilities">GitHub 源码与详细文档</a></footer></main></html>
